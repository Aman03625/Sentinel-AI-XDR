<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sentinel AI XDR</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

    <div class="auth-container">

        <!-- LEFT SIDE -->
        <div class="auth-brand">

            <div class="auth-logo">
                <span>◈</span> SENTINEL AI
            </div>

            <div class="auth-content">

                <div class="auth-badge">
                    ● SECURE ACCESS
                </div>

                <h1>
                    Defend your<br>
                    <span>digital world.</span>
                </h1>

                <p>
                    Access your centralized cybersecurity intelligence
                    dashboard powered by Sentinel AI XDR.
                </p>

            </div>

            <div class="system-status">
                <span class="status-dot"></span>
                ALL SYSTEMS OPERATIONAL
            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="auth-card-wrapper">

            <div class="auth-card">

                <div class="auth-card-header">

                    <div>
                        <h2>Welcome back</h2>

                        <p>
                            Sign in to your Sentinel account
                        </p>
                    </div>

                    <div class="shield-icon">
                        ◇
                    </div>

                </div>


                <form method="POST" action="/login">

                    <div class="input-group">

                        <label>Email Address</label>

                        <input
                            type="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <div class="password-label">

                            <label>Password</label>

                            <a href="#">Forgot?</a>

                        </div>

                        <input
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div class="remember">

                        <label>
                            <input type="checkbox">
                            Remember me
                        </label>

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                    >
                        Sign In
                        <span>→</span>
                    </button>

                </form>


                <div class="divider">
                    <span>OR</span>
                </div>


                <div class="register-text">

                    Don't have an account?

                   <a href="/register">
                    Create account
                        </a>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
